name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The control plane defaults to DRY_RUN=true and FIXTURE_MODE=true and ships no
# GHL credentials, so CI cannot reach an ESP or send mail. Do not add GHL
# secrets to this workflow.
jobs:
  test:
    name: typecheck + tests + dummy path
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newsletter
          POSTGRES_PASSWORD: newsletter
          POSTGRES_DB: newsletter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsletter -d newsletter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Present so tests/postgres-e2e.test.ts, the Postgres retention test and
      # the DB-backed invariants (tokens hashed at rest, issue_events
      # append-only) actually run instead of self-skipping.
      DATABASE_URL: postgres://newsletter:newsletter@127.0.0.1:5432/newsletter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npm run migrate

      - name: Tests (Postgres paths included)
        run: npm test

      - name: Tests again without a database
        # The suite must stay green for contributors with no Postgres; this
        # catches a test that silently depends on DATABASE_URL being set.
        run: npm test
        env:
          DATABASE_URL: ""

      - name: Assemble a frozen issue from fixtures
        run: npm run assemble:fixture

      - name: Prove GET approval is inert and POST consumes once
        run: npm run approve:dummy

  image:
    name: build the production image and boot it
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newsletter
          POSTGRES_PASSWORD: newsletter
          POSTGRES_DB: newsletter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsletter -d newsletter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # A Dockerfile that has never been built is a guess. This builds the real
      # multi-stage image (which also runs typecheck + compile inside it) and
      # then proves the runtime stage actually starts and serves /health — the
      # part a build alone would not catch.
      - name: Build
        run: docker build -t e02-control-plane:ci .

      - name: Confirm the image is not running as root
        run: |
          USER_ID="$(docker run --rm e02-control-plane:ci id -u)"
          echo "uid=$USER_ID"
          [ "$USER_ID" != "0" ] || { echo "image runs as root"; exit 1; }

      - name: Confirm no TypeScript toolchain shipped in the runtime stage
        run: |
          ! docker run --rm e02-control-plane:ci sh -c 'ls node_modules/tsx' 2>/dev/null \
            || { echo "tsx present in the production image"; exit 1; }

      - name: Migrate with the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://newsletter:newsletter@127.0.0.1:5432/newsletter \
            e02-control-plane:ci node dist/migrate.js

      - name: Boot the image and check health
        run: |
          docker run -d --name cp --network host \
            -e APP_ENV=staging -e DRY_RUN=true -e FIXTURE_MODE=true \
            -e APP_SECRET=ci-secret-at-least-32-bytes-long-x \
            -e WORKER_TOKEN=ci-worker-token \
            -e PUBLIC_BASE_URL=http://127.0.0.1:8787 \
            -e DATABASE_URL=postgres://newsletter:newsletter@127.0.0.1:5432/newsletter \
            e02-control-plane:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health | grep -q '"ok":true'; then
              echo "healthy after ${i}s"; break
            fi
            [ "$i" -eq 30 ] && { docker logs cp; exit 1; }
            sleep 1
          done

      - name: Assemble an issue inside the image (proves assets resolve from dist/)
        run: |
          curl -fsS -X POST http://127.0.0.1:8787/internal/clock/tick \
            -H 'Authorization: Bearer ci-worker-token' -H 'content-type: application/json' \
            -d '{"now":"2026-08-20T19:00:00.000Z"}'
          curl -fsS -X POST http://127.0.0.1:8787/internal/issues/x/ingest-posts \
            -H 'Authorization: Bearer ci-worker-token' -H 'content-type: application/json' -d '{}'
          curl -fsS -X POST http://127.0.0.1:8787/internal/issues/x/ingest-threats \
            -H 'Authorization: Bearer ci-worker-token' -H 'content-type: application/json' -d '{}'
          curl -fsS -X POST \
            "http://127.0.0.1:8787/internal/issues/aspire-America~New_York-2026-W34/assemble" \
            -H 'Authorization: Bearer ci-worker-token' -H 'content-type: application/json' \
            -d '{"now":"2026-08-20T19:00:00.000Z"}' | tee /tmp/assemble.json
          grep -q '"status":"assembled"' /tmp/assemble.json

      - name: Docker HEALTHCHECK reports healthy
        run: |
          for i in $(seq 1 40); do
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' cp)"
            [ "$STATUS" = "healthy" ] && { echo "healthcheck: healthy"; exit 0; }
            [ "$STATUS" = "unhealthy" ] && { docker logs cp; exit 1; }
            sleep 2
          done
          docker logs cp; exit 1

      - name: Backup and restore drill against the image's database
        run: |
          export DATABASE_URL=postgres://newsletter:newsletter@127.0.0.1:5432/newsletter
          export BACKUP_DIR="$RUNNER_TEMP/backups"
          ./scripts/backup.sh
          ./scripts/restore-drill.sh

      - if: always()
        run: docker rm -f cp || true
