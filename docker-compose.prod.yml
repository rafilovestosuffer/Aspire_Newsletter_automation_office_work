# Production overlay for the DRY_RUN control plane.
# Do not set DRY_RUN=false here. Do not import n8n.
#
#   cp .env.example .env   # fill 32+ APP_SECRET, unique WORKER_TOKEN, POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Optional TLS proxy: --profile proxy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsletter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-newsletter}
    volumes:
      - newsletter_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsletter -d newsletter"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-newsletter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-newsletter}
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DRY_RUN: "true"
      FIXTURE_MODE: "true"
      # Never echo approval tokens on a reachable host. Redundant with the
      # APP_ENV=development check in requestApproval, but stated explicitly
      # because this overlay also sets FIXTURE_MODE=true.
      ALLOW_TOKEN_ECHO: "0"
      DATABASE_URL: postgres://${POSTGRES_USER:-newsletter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-newsletter}
      ARTIFACT_DIR: /data/artifacts
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      PORT: "8787"
    volumes:
      - newsletter_artifacts:/data/artifacts
    ports:
      - "8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  newsletter_pg_prod:
  newsletter_artifacts:
  caddy_data:
  caddy_config:
